<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | SoundWave Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 100%); padding-top: 0; }
        .auth-bg { position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=1400&auto=format&fit=crop') center/cover; filter: brightness(0.12) saturate(0.5); z-index: 0; }
        .auth-wrapper { position: relative; z-index: 1; width: 100%; max-width: 480px; padding: 1rem; }
        .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; padding: 0; }
        .pw-wrapper { position: relative; }
        .strength-bar { height: 4px; border-radius: 2px; transition: width 0.3s, background-color 0.3s; }
    </style>
</head>
<body>
<div class="auth-bg"></div>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none">
                <h2 class="auth-title"><i class="bi bi-music-note-beamed me-2"></i>SOUNDWAVE</h2>
            </a>
            <p class="text-muted small mt-1">Crea tu cuenta gratuita</p>
        </div>

        <div id="alertReg" class="alert alert-danger d-none"></div>
        <div id="alertSuccess" class="alert alert-success d-none"></div>

        <form id="formRegistro" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-white">Nombre *</label>
                    <input type="text" class="form-control sw-input" id="regNombre" placeholder="Tu nombre" required minlength="2">
                    <div class="invalid-feedback">Mínimo 2 caracteres</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-white">Apellido *</label>
                    <input type="text" class="form-control sw-input" id="regApellido" placeholder="Tu apellido" required minlength="2">
                    <div class="invalid-feedback">Mínimo 2 caracteres</div>
                </div>
                <div class="col-12">
                    <label class="form-label text-white">Correo electrónico *</label>
                    <input type="email" class="form-control sw-input" id="regEmail" placeholder="tu@email.com" required>
                    <div class="invalid-feedback">Ingresa un correo válido</div>
                </div>
                <div class="col-12">
                    <label class="form-label text-white">Teléfono</label>
                    <input type="tel" class="form-control sw-input" id="regTelefono" placeholder="+57 300 000 0000" pattern="[0-9+\s]{7,15}">
                    <div class="invalid-feedback">Número de teléfono inválido</div>
                </div>
                <div class="col-12">
                    <label class="form-label text-white">Contraseña *</label>
                    <div class="pw-wrapper">
                        <input type="password" class="form-control sw-input pe-5" id="regPassword" placeholder="Mínimo 8 caracteres" required minlength="8" oninput="verificarFuerza(this.value)">
                        <button type="button" class="pw-toggle" id="togglePw1"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="mt-2">
                        <div class="bg-secondary rounded" style="height:4px;">
                            <div id="strengthBar" class="strength-bar" style="width:0%;"></div>
                        </div>
                        <small id="strengthText" class="text-muted"></small>
                    </div>
                    <div class="invalid-feedback">La contraseña debe tener mínimo 8 caracteres</div>
                </div>
                <div class="col-12">
                    <label class="form-label text-white">Confirmar contraseña *</label>
                    <div class="pw-wrapper">
                        <input type="password" class="form-control sw-input pe-5" id="regConfirm" placeholder="Repite tu contraseña" required>
                        <button type="button" class="pw-toggle" id="togglePw2"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="invalid-feedback">Las contraseñas no coinciden</div>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="terminos" required>
                        <label class="form-check-label text-muted small" for="terminos">
                            Acepto los <a href="#" class="text-warning">Términos y Condiciones</a> y la <a href="#" class="text-warning">Política de Privacidad</a>
                        </label>
                        <div class="invalid-feedback">Debes aceptar los términos</div>
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
                        <i class="bi bi-person-plus-fill me-2"></i>CREAR CUENTA
                    </button>
                </div>
            </div>
        </form>

        <hr class="border-secondary mt-4">
        <p class="text-center text-muted small mb-0">
            ¿Ya tienes cuenta?
            <a href="login.html" class="text-warning text-decoration-none fw-bold">Inicia sesión</a>
        </p>
        <p class="text-center mt-2">
            <a href="index.html" class="text-secondary small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Volver a la tienda
            </a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// =============================================
// REGISTRO – Validación JS + JSON + LocalStorage
// =============================================

// Toggle passwords
function makeToggle(btnId, inputId) {
    document.getElementById(btnId).addEventListener('click', function() {
        const pw = document.getElementById(inputId);
        const icon = this.querySelector('i');
        pw.type = pw.type === 'password' ? 'text' : 'password';
        icon.className = pw.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });
}
makeToggle('togglePw1', 'regPassword');
makeToggle('togglePw2', 'regConfirm');

// Fuerza de contraseña
function verificarFuerza(valor) {
    const bar = document.getElementById('strengthBar');
    const txt = document.getElementById('strengthText');
    let score = 0;
    if (valor.length >= 8) score++;
    if (/[A-Z]/.test(valor)) score++;
    if (/[0-9]/.test(valor)) score++;
    if (/[^A-Za-z0-9]/.test(valor)) score++;

    const configs = [
        { width: '0%', color: '', texto: '' },
        { width: '25%', color: '#dc3545', texto: 'Muy débil' },
        { width: '50%', color: '#fd7e14', texto: 'Débil' },
        { width: '75%', color: '#ffc107', texto: 'Aceptable' },
        { width: '100%', color: '#198754', texto: 'Fuerte 💪' }
    ];
    const c = configs[score];
    bar.style.width = c.width;
    bar.style.backgroundColor = c.color;
    txt.textContent = c.texto;
    txt.style.color = c.color;
}

// Gestión usuarios en LocalStorage (JSON)
function obtenerUsuarios() {
    return JSON.parse(localStorage.getItem('sw-usuarios') || '[]');
}

function guardarUsuarios(usuarios) {
    localStorage.setItem('sw-usuarios', JSON.stringify(usuarios));
}

// Formulario Registro
document.getElementById('formRegistro').addEventListener('submit', function(e) {
    e.preventDefault();

    const campos = {
        nombre: document.getElementById('regNombre'),
        apellido: document.getElementById('regApellido'),
        email: document.getElementById('regEmail'),
        telefono: document.getElementById('regTelefono'),
        password: document.getElementById('regPassword'),
        confirm: document.getElementById('regConfirm'),
        terminos: document.getElementById('terminos')
    };

    const alertEl = document.getElementById('alertReg');
    const successEl = document.getElementById('alertSuccess');
    alertEl.classList.add('d-none');
    successEl.classList.add('d-none');

    Object.values(campos).forEach(f => f.classList.remove('is-invalid', 'is-valid'));

    let valido = true;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const telRegex = /^[0-9+\s]{7,15}$/;

    if (campos.nombre.value.trim().length < 2) { campos.nombre.classList.add('is-invalid'); valido = false; } else campos.nombre.classList.add('is-valid');
    if (campos.apellido.value.trim().length < 2) { campos.apellido.classList.add('is-invalid'); valido = false; } else campos.apellido.classList.add('is-valid');
    if (!emailRegex.test(campos.email.value.trim())) { campos.email.classList.add('is-invalid'); valido = false; } else campos.email.classList.add('is-valid');

    if (campos.telefono.value.trim() && !telRegex.test(campos.telefono.value.trim())) {
        campos.telefono.classList.add('is-invalid'); valido = false;
    } else if (campos.telefono.value.trim()) {
        campos.telefono.classList.add('is-valid');
    }

    if (campos.password.value.length < 8) { campos.password.classList.add('is-invalid'); valido = false; } else campos.password.classList.add('is-valid');

    if (campos.confirm.value !== campos.password.value) {
        campos.confirm.classList.add('is-invalid');
        campos.confirm.nextElementSibling.nextElementSibling.textContent = 'Las contraseñas no coinciden';
        valido = false;
    } else if (campos.confirm.value.length >= 8) {
        campos.confirm.classList.add('is-valid');
    }

    if (!campos.terminos.checked) { campos.terminos.classList.add('is-invalid'); valido = false; }

    if (!valido) return;

    // Verificar email duplicado
    const usuarios = obtenerUsuarios();
    if (usuarios.find(u => u.email.toLowerCase() === campos.email.value.trim().toLowerCase())) {
        alertEl.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>Este correo ya está registrado. <a href="login.html" class="alert-link">Inicia sesión</a>';
        alertEl.classList.remove('d-none');
        campos.email.classList.add('is-invalid');
        return;
    }

    // Crear objeto usuario en formato JSON
    const nuevoUsuario = {
        id: Date.now(),
        nombre: campos.nombre.value.trim(),
        apellido: campos.apellido.value.trim(),
        email: campos.email.value.trim().toLowerCase(),
        telefono: campos.telefono.value.trim(),
        password: campos.password.value, // En producción real usar hashing
        fechaRegistro: new Date().toISOString(),
        activo: true
    };

    usuarios.push(nuevoUsuario);
    guardarUsuarios(usuarios);

    // Log JSON en consola (evidencia de formato JSON)
    console.log('Usuario registrado (JSON):', JSON.stringify(nuevoUsuario, null, 2));
    console.log('Todos los usuarios:', JSON.stringify(usuarios, null, 2));

    successEl.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>¡Cuenta creada exitosamente! Bienvenido, <strong>${nuevoUsuario.nombre}</strong>. Redirigiendo al login...`;
    successEl.classList.remove('d-none');
    this.reset();
    Object.values(campos).forEach(f => f.classList.remove('is-valid'));
    document.getElementById('strengthBar').style.width = '0%';
    document.getElementById('strengthText').textContent = '';

    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
});
</script>
</body>
</html>
